    // WEB AUDIO SYNTHESIZER (No external MP3 required — works offline on any PID)

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'success') {
          const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.18, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.26);
          });
        } else if (type === 'retry') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(220, now + 0.22);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'tap') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'fanfare') {
          const chord = [523.25, 659.25, 783.99, 987.77, 1046.5];
          chord.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.15, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.55);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.56);
          });
        }

        // Ignore audio context restriction errors if user hasn't interacted yet

        `Sahabat belajarku adalah ${s2} yang sangat rajin serta tekun berlatih. Ia tidak pernah malas saat diberi tugas oleh guru. Tulisan tangan ${s2} juga sangat rapi dan apik sehingga mudah dibaca dan tidak berantakan.`
      ];
      return templates[idx % templates.length];
    };

    // Fungsi pembentuk 15 Pasangan dari array nama siswa
    const buildPairsFromStudentNames = (namesArray) => {
      const cleaned = namesArray.map(n => n.trim()).filter(Boolean);
      const padded = [...cleaned];
      while (padded.length < 2) {
        padded.push(`Siswa ${padded.length + 1}`);
      }
      if (padded.length % 2 !== 0) {
        padded.push('Teman Kolaborasi PID');
      }

      const pairsCount = Math.ceil(padded.length / 2);
      const resultPairs = [];
      for (let i = 0; i < pairsCount; i++) {
        const s1 = padded[i * 2];
        const s2 = padded[i * 2 + 1] || 'Teman Kolaborasi';
        const theme = GROUP_THEMES_15[i % GROUP_THEMES_15.length];
        const readiness = READINESS_LEVELS_CYCLE[i % READINESS_LEVELS_CYCLE.length];
        const role = TASK_ROLES_15[i % TASK_ROLES_15.length];
        resultPairs.push({
          id: `P${i + 1}`,
          student1: s1,
          student2: s2,
          groupName: `Pasangan ${i + 1} (${theme})`,
          readiness,
          s1Done: false,
          s2Done: false,
          taskRole: role,
          score: 86 + ((i * 3) % 11),
          description: createDynamicPairDescription(s1, s2, i)
        });
      }
      return resultPairs;
    };

    // Saat pertama kali dibuka di PID, otomatis acak 30 siswa SDN 4 Rambutan menjadi 15 pasangan
    const INITIAL_SHUFFLED_PAIRS_30 = buildPairsFromStudentNames(shuffleArray(DEFAULT_30_STUDENTS));

    // Helper: Format seconds into MM:SS
    const formatDuration = (totalSeconds) => {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    };

    function App() {
      // ==========================================================================
      // 1. STUDENT IDENTITY, 30-STUDENT ROSTER (SDN 4 RAMBUTAN) & DIFFERENTIATION
      // ==========================================================================
      const [studentNamesInput, setStudentNamesInput] = useState(DEFAULT_30_STUDENTS.join('\n'));
      const [showNameInputPanel, setShowNameInputPanel] = useState(false);
      const [isShufflingPairs, setIsShufflingPairs] = useState(false);
      const [shuffleCountBadge, setShuffleCountBadge] = useState(1);
      const [pairingModeLabel, setPairingModeLabel] = useState('Acak Otomatis PID (30 Siswa)');
      const [showLivePairBoardOnMain, setShowLivePairBoardOnMain] = useState(true);

      const [classPairs, setClassPairs] = useState(INITIAL_SHUFFLED_PAIRS_30);
      const [activePairId, setActivePairId] = useState('P1');
      const [showTurnModal, setShowTurnModal] = useState(false);
      const [showClassStrategyModal, setShowClassStrategyModal] = useState(false);
      const [pickedStudentNotice, setPickedStudentNotice] = useState(null);

      const [studentProfile, setStudentProfile] = useState({
        name: INITIAL_SHUFFLED_PAIRS_30[0].student1,
        partnerName: INITIAL_SHUFFLED_PAIRS_30[0].student2,
        className: 'Kelas V SDN 4 Rambutan (30 Siswa: 18 LK & 12 PR)',
        schoolName: 'SDN 4 Rambutan',
        readinessLevel: INITIAL_SHUFFLED_PAIRS_30[0].readiness, // 'Perlu Bimbingan' | 'Cukup' | 'Mahir'
        date: new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
      });

      // Count how many of the 30 students have already had a turn at the PID
      const totalStudentsParticipated = useMemo(() => {
        return classPairs.reduce((acc, p) => acc + (p.s1Done ? 1 : 0) + (p.s2Done ? 1 : 0), 0);
      }, [classPairs]);

      // ==========================================================================
      // 2. NAVIGATION & STAGE TIMER STATE
      // ==========================================================================
      // Stages: 'tahap1' (Memahami - 15m), 'tahap2' (Mengaplikasi - 40m), 'tahap3' (Merefleksi - 15m), 'laporan' (Laporan & Cetak)
      const [activeStage, setActiveStage] = useState('tahap1');
      const [subTabTahap1, setSubTabTahap1] = useState('kuis'); // 'kuis' | 'cerita'
      const [subTabTahap2, setSubTabTahap2] = useState('matching'); // 'matching' | 'canvas' | 'gallery'
      const [subTabTahap3, setSubTabTahap3] = useState('presentasi'); // 'presentasi' | 'polling'
      const [showRppModal, setShowRppModal] = useState(false);
      const [isTimerRunning, setIsTimerRunning] = useState(true);

      // Stage timers in seconds (records exact duration student spends on each stage)
      const [stageTimers, setStageTimers] = useState({
        tahap1: 0, // Target: 15 mins (900s)
        tahap2: 0, // Target: 40 mins (2400s)
        tahap3: 0  // Target: 15 mins (900s)
      });

      const STAGE_TARGETS = {
        tahap1: 15 * 60,
        tahap2: 40 * 60,
        tahap3: 15 * 60
      };

      useEffect(() => {
        if (!isTimerRunning || activeStage === 'laporan') return;
        const interval = setInterval(() => {
          setStageTimers((prev) => ({
            ...prev,
            [activeStage]: (prev[activeStage] || 0) + 1
          }));
        }, 1000);
        return () => clearInterval(interval);
      }, [isTimerRunning, activeStage]);

      const totalElapsedSeconds = stageTimers.tahap1 + stageTimers.tahap2 + stageTimers.tahap3;

      // ==========================================================================
      // 3. TAHAP 1 STATE: KUIS TEBAK KATA SIFAT & HIGHLIGHTING TEKS RANA DAN RANI
      // ==========================================================================
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizFeedback, setQuizFeedback] = useState(null);
      const [highlightedWords, setHighlightedWords] = useState([
        'kembar', 'ramah', 'pendiam', 'periang', 'rapi'
      ]); // Pre-seeded with 5 examples or interactive
      const [selectedStoryWord, setSelectedStoryWord] = useState(RANA_RANI_STORY[1].tokens[11]); // Default 'pendiam'
      const [nonAdjectiveNotice, setNonAdjectiveNotice] = useState('');

      // ==========================================================================
      // 4. TAHAP 2 STATE: TAP-TO-MATCH SINONIM/ANTONIM, CANVAS & GALLERY PEER-REVIEW
      // ==========================================================================
      const [selectedChallengeId, setSelectedChallengeId] = useState('m1');
      const [matchedResults, setMatchedResults] = useState({
        m1: 'SINONIM',
        m2: 'SINONIM',
        m6: 'ANTONIM',
        m7: 'ANTONIM'
      });
      const [matchingAttempts, setMatchingAttempts] = useState(4);
      const [matchingCorrectCount, setMatchingCorrectCount] = useState(4);
      const [matchFeedbackBanner, setMatchFeedbackBanner] = useState({
        type: 'info',
        message: 'Halo, Anak Cerdas SDN 4 Rambutan! Ketuk salah satu Kartu Pasangan Kata di bawah, lalu ketuk kotak SINONIM atau ANTONIM ya!'
      });

      // Fitur 3: Dynamic Description Canvas
      const [descriptionTarget, setDescriptionTarget] = useState('Teman Sebangku'); // 'Diri Sendiri' | 'Teman Sebangku'
      const [studentDescription, setStudentDescription] = useState(
        INITIAL_SHUFFLED_PAIRS_30[0].description
      );
      const [isPublishedToGallery, setIsPublishedToGallery] = useState(true);

      // Fitur 4: Gallery Board & Peer-Review Checklist (4 Official Aspects)
      const [galleryItems, setGalleryItems] = useState(INITIAL_GALLERY_PEERS);
      const [myGalleryStars, setMyGalleryStars] = useState(16);
      const [peerReviewChecklist, setPeerReviewChecklist] = useState({
        reviewerName: INITIAL_SHUFFLED_PAIRS_30[0].student2,
        aspek1_kataSifat: 'Ya',
        aspek2_sinonim: 'Ya',
        aspek3_antonim: 'Ya',
        aspek4_kesantunan: 'Ya',
        catatanApresiasi: 'Kalimat deskripsinya sangat santun, seru dibaca, dan pasangan sinonim-antonimnya tepat sekali!'
      });

      // ==========================================================================
      // 5. TAHAP 3 STATE: PRESENTASI & LIVE POLLING REFLEKSI EMOTICON
      // ==========================================================================
      const [hasPresented, setHasPresented] = useState(true);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [selectedEmotion, setSelectedEmotion] = useState('sangat_senang');
      const [understandingLevel, setUnderstandingLevel] = useState('mahir_paham');
      const [metacognitiveNote, setMetacognitiveNote] = useState(
        'Hari ini aku sangat senang karena bisa membedakan kata sifat, mencari persamaan kata (sinonim), dan lawan kata (antonim) untuk memuji keunikan sahabatku secara santun!'
      );
      const [classPollCounts, setClassPollCounts] = useState({
        sangat_senang: 20,
        senang: 7,
        penasaran: 2,
        butuh_bantuan: 1
      });

      // Switch active pair from the 15 pairs (30 students) roster
      const handleSelectPair = (pairId) => {
        playSound('tap');
        const found = classPairs.find(p => p.id === pairId);
        if (!found) return;
        setActivePairId(pairId);
        setStudentProfile(prev => ({
          ...prev,
          name: found.student1,
          partnerName: found.student2,
          readinessLevel: found.readiness
        }));
        setStudentDescription(found.description);
        setPeerReviewChecklist(prev => ({
          ...prev,
          reviewerName: found.student2
        }));
      };

      // Toggle individual student participation status (out of 30 students)
      const handleToggleStudentTurn = (pairId, slot) => {
        playSound('success');
        setClassPairs(prev =>
          prev.map(p => {
            if (p.id !== pairId) return p;
            return slot === 1 ? { ...p, s1Done: !p.s1Done } : { ...p, s2Done: !p.s2Done };
          })
        );
      };

      // Random Picker that prioritizes students out of the 30 who haven't come to the PID yet
      const handlePickNextStudentToPID = () => {
        playSound('fanfare');
        const remaining = [];
        classPairs.forEach(p => {
          if (!p.s1Done) remaining.push({ pairId: p.id, slot: 1, name: p.student1, partner: p.student2, groupName: p.groupName, readiness: p.readiness });
          if (!p.s2Done) remaining.push({ pairId: p.id, slot: 2, name: p.student2, partner: p.student1, groupName: p.groupName, readiness: p.readiness });
        });

        // If all 30 have participated, pick from all 30
        const pool = remaining.length > 0 ? remaining : classPairs.flatMap(p => [
          { pairId: p.id, slot: 1, name: p.student1, partner: p.student2, groupName: p.groupName, readiness: p.readiness },
          { pairId: p.id, slot: 2, name: p.student2, partner: p.student1, groupName: p.groupName, readiness: p.readiness }
        ]);

        const chosen = pool[Math.floor(Math.random() * pool.length)];
        if (!chosen) return;

        // Mark chosen student as having participated at PID & activate their pair
        setClassPairs(prev =>
          prev.map(p => {
            if (p.id !== chosen.pairId) return p;
            return chosen.slot === 1 ? { ...p, s1Done: true } : { ...p, s2Done: true };
          })
        );
        handleSelectPair(chosen.pairId);
        setPickedStudentNotice(chosen);
      };

      // Mark all 30 students as having completed their PID turn (Demo/Quick Classroom Mode)
      const handleMarkAll30Participated = () => {
        playSound('fanfare');
        setClassPairs(prev => prev.map(p => ({ ...p, s1Done: true, s2Done: true })));
      };

      // Acak Pasangan Otomatis langsung di layar PID (Mendukung Acak Bebas & Acak Sejenis LK-LK / PR-PR)
      const handleRandomizePairsOnPID = (openModalAfter = false, mode = 'bebas') => {
        playSound('tap');
        setIsShufflingPairs(true);
        if (openModalAfter) {
          setShowTurnModal(true);
        }

        // Parse current student names from input (supports newline, comma, or numbered lists)
        const parsedNames = studentNamesInput
          .split(/[\n,;]+/)
          .map(line => line.replace(/^\d+[\.\)\-\s]+/, '').trim())
          .filter(Boolean);

        const baseNames = parsedNames.length >= 2 ? parsedNames : DEFAULT_30_STUDENTS;

        setTimeout(() => {
          let orderedNames = [];
          if (mode === 'sejenis') {
            // Kelompokkan 18 LK (9 pasang) dan 12 PR (6 pasang) lalu acak masing-masing
            const boys = shuffleArray(baseNames.filter(n => getGenderBadge(n) === 'LK'));
            const girls = shuffleArray(baseNames.filter(n => getGenderBadge(n) === 'PR'));
            const others = shuffleArray(baseNames.filter(n => !getGenderBadge(n)));
            orderedNames = [...boys, ...girls, ...others];
            setPairingModeLabel('Acak Sejenis (9 Pasang LK & 6 Pasang PR)');
          } else {
            orderedNames = shuffleArray(baseNames);
            setPairingModeLabel('Acak Bebas (30 Siswa SDN 4 Rambutan)');
          }

          const newPairs = buildPairsFromStudentNames(orderedNames);
          setClassPairs(newPairs);
          setActivePairId('P1');
          setShowLivePairBoardOnMain(true);

          const firstPair = newPairs[0];
          if (firstPair) {
            setStudentProfile(prev => ({
              ...prev,
              name: firstPair.student1,
              partnerName: firstPair.student2,
              className: `Kelas V SDN 4 Rambutan (${orderedNames.length} Siswa / ${newPairs.length} Pasangan)`,
              readinessLevel: firstPair.readiness
            }));
            setStudentDescription(firstPair.description);
            setPeerReviewChecklist(prev => ({
              ...prev,
              reviewerName: firstPair.student2
            }));
          }

          setIsShufflingPairs(false);
          setShuffleCountBadge(prev => prev + 1);
          playSound('fanfare');
          setPickedStudentNotice({
            pairId: 'P1',
            slot: 1,
            name: firstPair.student1,
            partner: firstPair.student2,
            groupName: `${newPairs.length} Pasangan Kelas V SDN 4 Rambutan Berhasil Diacak di PID! Pasangan 1: ${firstPair.student1} & ${firstPair.student2}`,
            readiness: firstPair.readiness
          });
        }, 420);
      };

      // ==========================================================================
      // 6. ANALYTICS & SCORING ENGINE (TP C4 >= 85%, TP C6 & SUMMATIVE RUBRIC 1-4)
      // ==========================================================================
      const quizCorrectCount = useMemo(() => {
        return DIAGNOSTIC_QUIZ_DATA.reduce((acc, q) => {
          return acc + (quizAnswers[q.id] === q.correct ? 1 : 0);
        }, 0);
      }, [quizAnswers]);

      // Story highlighting progress
      const storyHighlightPercent = Math.round((highlightedWords.length / TOTAL_STORY_ADJECTIVES) * 100);

      // Matching progress & accuracy
      const matchedCount = Object.keys(matchedResults).length;
      const matchingCompletionPercent = Math.round((matchedCount / MATCHING_CHALLENGES.length) * 100);
      const matchingAccuracyPercent = matchingAttempts > 0
        ? Math.min(100, Math.round((matchingCorrectCount / matchingAttempts) * 100))
        : 100;

      // Combined TP 1 (Bloom C4) Score: Weighted average of Story Analysis & Sinonim/Antonim Matching
      const tp1ScoreC4 = useMemo(() => {
        const storyScore = (highlightedWords.length / TOTAL_STORY_ADJECTIVES) * 100;
        const matchScore = (matchedCount / MATCHING_CHALLENGES.length) * 100;
        // Blend completion & precision
        const raw = (storyScore * 0.45) + (matchScore * 0.35) + (matchingAccuracyPercent * 0.20);
        return Math.min(100, Math.round(raw));
      }, [highlightedWords.length, matchedCount, matchingAccuracyPercent]);

      const isTp1Mastered = tp1ScoreC4 >= 85; // Standard D in TP ABCDE: minimal 85%

      // Smart Analyzer for TP 2 (Bloom C6 - Mengkreasi 3-4 Kalimat Deskripsi)
      const sentenceAnalysis = useMemo(() => {
        const text = studentDescription.trim();
        const sentences = text
          ? text.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 3)
          : [];

        const lower = text.toLowerCase();
        const allAdjectives = [
          'ramah', 'supel', 'santun', 'periang', 'ceria', 'gembira', 'pendiam', 'tenang', 'kalem',
          'rapi', 'apik', 'teratur', 'berantakan', 'pintar', 'pandai', 'cerdas', 'rajin', 'tekun',
          'giat', 'malas', 'mandiri', 'berdikari', 'sabar', 'jujur', 'kreatif', 'ikal', 'lurus',
          'bulat', 'tinggi', 'manis', 'unik', 'pemberani', 'baik'
        ];
        const foundAdjectives = allAdjectives.filter(w => {
          const regex = new RegExp(`\\b${w}\\b`, 'i');
          return regex.test(lower);
        });

        const synonymPairsList = [
          ['pintar', 'pandai'], ['pintar', 'cerdas'], ['rapi', 'apik'], ['rapi', 'teratur'],
          ['ramah', 'supel'], ['ramah', 'santun'], ['periang', 'ceria'], ['periang', 'gembira'],
          ['rajin', 'tekun'], ['rajin', 'giat'], ['mandiri', 'berdikari'], ['mirip', 'serupa']
        ];
        const detectedSynonyms = synonymPairsList.filter(([a, b]) => lower.includes(a) && lower.includes(b));

        const antonymPairsList = [
          ['pendiam', 'periang'], ['pendiam', 'ceria'], ['rapi', 'berantakan'],
          ['rajin', 'malas'], ['lurus', 'ikal'], ['pemberani', 'penakut'], ['mandiri', 'manja']
        ];
        const detectedAntonyms = antonymPairsList.filter(([a, b]) => lower.includes(a) && lower.includes(b));

        return {
          sentenceCount: sentences.length,
          foundAdjectives,
          detectedSynonyms,
          detectedAntonyms,
          meetsLength: sentences.length >= 3
        };
      }, [studentDescription]);

      // Auto-computed Summative Rubric (Scale 1 to 4 per aspect, matching Section IV.C of RPP)
      const summativeRubric = useMemo(() => {
        const adjCount = sentenceAnalysis.foundAdjectives.length;
        const s1 = adjCount >= 3 ? 4 : adjCount === 2 ? 3 : adjCount === 1 ? 2 : 1;

        const synScore = sentenceAnalysis.detectedSynonyms.length >= 1 && matchedCount >= 8
          ? 4
          : (sentenceAnalysis.detectedSynonyms.length >= 1 || matchedCount >= 5)
            ? 3
            : matchedCount >= 3 ? 2 : 1;

        const antScore = sentenceAnalysis.detectedAntonyms.length >= 1 && matchedCount >= 8
          ? 4
          : (sentenceAnalysis.detectedAntonyms.length >= 1 || matchedCount >= 5)
            ? 3
            : matchedCount >= 3 ? 2 : 1;

        const ejaanScore = sentenceAnalysis.sentenceCount >= 3 && peerReviewChecklist.aspek4_kesantunan === 'Ya'
          ? 4
          : sentenceAnalysis.sentenceCount >= 2 ? 3 : sentenceAnalysis.sentenceCount === 1 ? 2 : 1;

        const totalPoints = s1 + synScore + antScore + ejaanScore; // max 16
        const finalScore100 = Math.round((totalPoints / 16) * 100);

        return {
          aspek1_kataSifat: s1,
          aspek2_sinonim: synScore,
          aspek3_antonim: antScore,
          aspek4_kesantunanEjaan: ejaanScore,
          totalPoints,
          finalScore100
        };
      }, [sentenceAnalysis, matchedCount, peerReviewChecklist.aspek4_kesantunan]);

      // ==========================================================================
      // 7. INTERACTION HANDLERS
      // ==========================================================================
      const handleSelectQuizOption = (questionObj, option) => {
        const isCorrect = option === questionObj.correct;
        setQuizAnswers(prev => ({ ...prev, [questionObj.id]: option }));

        if (isCorrect) {
          playSound('success');
          setQuizFeedback({
            type: 'success',
            title: 'Hebat! Jawabanmu Tepat Sekali! 🌟',
            text: questionObj.explanation
          });
        } else {
          playSound('retry');
          setQuizFeedback({
            type: 'retry',
            title: 'Yuk, coba lagi! Kamu pasti bisa! 💪',
            text: `Pilihan "${option}" belum tepat untuk menggambarkan situasi di atas. Coba perhatikan petunjuk kalimatnya ya!`
          });
        }
      };

      const handleApplyDiagnosticRecommendation = () => {
        playSound('tap');
        let recommended = 'Cukup';
        if (quizCorrectCount === 4) recommended = 'Mahir';
        else if (quizCorrectCount <= 2) recommended = 'Perlu Bimbingan';
        setStudentProfile(prev => ({ ...prev, readinessLevel: recommended }));
        setSubTabTahap1('cerita');
      };

      const handleTapStoryWord = (token) => {
        const cleanWord = token.clean || token.text.replace(/[.,!?]/g, '');
        if (token.isAdjective) {
          playSound('success');
          setNonAdjectiveNotice('');
          setSelectedStoryWord(token);
          if (!highlightedWords.includes(token.key)) {
            setHighlightedWords(prev => [...prev, token.key]);
          }
        } else {
          playSound('retry');
          setNonAdjectiveNotice(`Kata "${cleanWord}" bukan kata sifat. Yuk, cari kata yang menjelaskan ciri fisik atau sifat tokoh Rana & Rani!`);
        }
      };

      const handleMatchZoneTap = (zoneType) => {
        if (!selectedChallengeId) {
          playSound('retry');
          setMatchFeedbackBanner({
            type: 'warning',
            message: 'Ketuk salah satu Kartu Pasangan Kata di sebelah kiri terlebih dahulu ya, Anak Cerdas!'
          });
          return;
        }

        const currentCard = MATCHING_CHALLENGES.find(c => c.id === selectedChallengeId);
        if (!currentCard) return;

        setMatchingAttempts(prev => prev + 1);

        if (currentCard.relation === zoneType) {
          playSound('success');
          setMatchingCorrectCount(prev => prev + 1);
          setMatchedResults(prev => ({ ...prev, [currentCard.id]: zoneType }));
          setMatchFeedbackBanner({
            type: 'success',
            message: `Hebat! Pasangan "${currentCard.baseWord}" dan "${currentCard.targetWord}" adalah ${zoneType}! 🎉`
          });

          // Automatically select next unmatched card if available
          const nextUnmatched = MATCHING_CHALLENGES.find(
            c => c.id !== currentCard.id && !matchedResults[c.id]
          );
          if (nextUnmatched) {
            setSelectedChallengeId(nextUnmatched.id);
          }
        } else {
          playSound('retry');
          setMatchFeedbackBanner({
            type: 'error',
            message: `Yuk, coba lagi! Perhatikan arti kata "${currentCard.baseWord}" dan "${currentCard.targetWord}". Apakah artinya sama (Sinonim) atau berlawanan (Antonim)? 💡`
          });
        }
      };

      const handleInsertDiction = (textToInsert) => {
        playSound('tap');
        setStudentDescription(prev => {
          const trimmed = prev.trim();
          if (!trimmed) return textToInsert;
          const separator = trimmed.endsWith('.') ? ' ' : ' ';
          return `${trimmed}${separator}${textToInsert}`;
        });
      };

      const handleSpeakPresentation = () => {
        if (!('speechSynthesis' in window)) {
          setHasPresented(true);
          playSound('fanfare');
          return;
        }
        window.speechSynthesis.cancel();
        if (isSpeaking) {
          setIsSpeaking(false);
          return;
        }
        const utterance = new SpeechSynthesisUtterance(studentDescription);
        utterance.lang = 'id-ID';
        utterance.rate = 0.95;
        utterance.pitch = 1.05;
        utterance.onstart = () => setIsSpeaking(true);
        utterance.onend = () => {
          setIsSpeaking(false);
          setHasPresented(true);
          playSound('fanfare');
        };
        utterance.onerror = () => setIsSpeaking(false);
        window.speechSynthesis.speak(utterance);
        setHasPresented(true);
      };

      const handleVoteEmotion = (emotionKey) => {
        playSound('success');
        if (selectedEmotion !== emotionKey) {
          setClassPollCounts(prev => ({
            ...prev,
            [selectedEmotion]: Math.max(0, (prev[selectedEmotion] || 1) - 1),
            [emotionKey]: (prev[emotionKey] || 0) + 1
          }));
          setSelectedEmotion(emotionKey);
        }
      };

      const handlePrintReport = () => {
        playSound('tap');
        setActiveStage('laporan');
        setTimeout(() => {
          window.print();
        }, 250);
      };

      return (

                      <ul className="list-disc pl-4 space-y-1 text-xs">

                        <li><strong>Sorot Teks "Rana & Rani" (12 Kata Sifat):</strong> Gunakan metode <strong>Estafet Sentuh (Tap Relay)</strong>! <strong>12 murid berikutnya</strong> maju berurutan (masing-masing 15 detik) untuk menyentuh 1 kata sifat pada cerita.</li>
                      </ul>
                    </div>

                    <div className="p-4 rounded-2xl bg-orange-50 border-2 border-orange-200 space-y-2">
                      <div className="font-extrabold text-orange-900">
                        2️⃣ TAHAP 2: MENGAPLIKASI (40 Menit)
                      </div>
                      <div className="text-xs font-bold text-orange-700">Kuota Maju PID: 14 Murid Sisa + 15 Pasangan</div>
                      <ul className="list-disc pl-4 space-y-1 text-xs">
                        <li><strong>Simulasi Sinonim & Antonim (10 Kartu):</strong> <strong>10 murid yang belum maju</strong> di Tahap 1 dipanggil dengan tombol Undian untuk memetakan 10 kartu (masing-masing 1 kartu).</li>
                        <li><strong>Menulis Kalimat Deskripsi (Hibrida Bangku + PID):</strong> Jangan menyuruh 30 anak mengantre mengetik dari nol di 1 layar! 15 pasangan merancang draf 3–4 kalimat di kertas/LKPD masing-masing sambil melihat <strong>Kotak Bantuan Diksi</strong> yang ditayangkan besar di PID. Sementara itu, <strong>2–4 pasangan perwakilan</strong> mengetik langsung di Canvas PID.</li>
                      </ul>
                    </div>

                    <div className="p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-200 space-y-2">
                      <div className="font-extrabold text-emerald-900">
                        3️⃣ TAHAP 3: MEREFLEKSI (15 Menit)
                      </div>
                      <div className="text-xs font-bold text-emerald-700">Kuota Maju PID: Seluruh 30 Murid (100%)</div>
                      <ul className="list-disc pl-4 space-y-1 text-xs">
                        <li><strong>Presentasi Karya (8 Menit):</strong> Pilih <strong>3 Pasangan</strong> (mewakili level <em>Perlu Bimbingan, Cukup, dan Mahir</em>) untuk membacakan karyanya di depan PID dan menekan tombol <em>Peer-Review</em>.</li>
                        <li><strong>Kereta Cepat Polling 30 Murid (7 Menit):</strong> 30 murid berbaris membentuk "Kereta Apresiasi" melewati depan layar PID. Setiap murid menyentuh tombol <strong>+1 Emoticon Perasaan</strong> (hanya 2 detik/anak = 1 menit untuk 30 murid!).</li>
                      </ul>
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-100 border-t border-slate-200 flex justify-end">
                  <button
                    onClick={() => setShowClassStrategyModal(false)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs sm:text-sm"
                  >
                    Siap Terapkan di Kelas!
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ====================================================================
              MODAL DOKUMEN RPP DIGITAL LENGKAP, TP (ABCDE), ATP & PANDUAN PID
          ==================================================================== */}
          {showRppModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 overflow-y-auto no-print">
              <div className="bg-white rounded-3xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl border-4 border-sky-400 animate-pop overflow-hidden">
                {/* Modal Header */}
                <div className="p-4 sm:p-6 bg-gradient-to-r from-sky-500 to-emerald-500 text-white flex items-center justify-between">
                  <div>
                    <span className="px-2.5 py-0.5 rounded-full bg-white/20 text-xs font-bold uppercase">
                      Dokumen Perencanaan Pembelajaran Mendalam Berbasis Digital
                    </span>
                    <h3 className="text-lg sm:text-2xl font-bold mt-1">
                      📘 Rumusan TP (ABCDE), ATP & RPP Digital Lengkap (2 × 35 Menit)
                    </h3>
                  </div>
                  <button
                    onClick={() => setShowRppModal(false)}
                    className="w-10 h-10 rounded-2xl bg-white/20 hover:bg-white/30 flex items-center justify-center text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Body */}
                <div className="p-5 sm:p-7 overflow-y-auto space-y-6 text-xs sm:text-sm text-slate-700 leading-relaxed">
                  {/* A. Rumusan TP ABCDE */}
                  <div className="bg-sky-50 p-5 rounded-2xl border-2 border-sky-200 space-y-3">
                    <h4 className="text-base font-extrabold text-sky-900">
                      A. RUMUSAN TUJUAN PEMBELAJARAN (TP) — TAKSONOMI BLOOM (ABCDE)
                    </h4>
                    <div className="space-y-2">
                      <div className="p-3.5 bg-white rounded-xl border border-sky-200">
                        <div className="font-extrabold text-sky-800">1. TP Kebahasaan & Kognitif (Bloom C4 - Menganalisis):</div>
                        <p className="mt-1">
                          "Melalui kegiatan membaca teks 'Rana dan Rani' pada layar Papan Interaktif Digital (PID) serta simulasi interaktif <strong>(C & E)</strong>, peserta didik Kelas V <strong>(A)</strong> dapat menganalisis (C4) kata sifat yang menunjukkan ciri fisik/karakter tokoh serta menentukan pasangan sinonim dan antonimnya <strong>(B)</strong> secara tepat dan teliti dengan tingkat ketepatan minimal 85% <strong>(D)</strong>."
                        </p>
                      </div>
                      <div className="p-3.5 bg-white rounded-xl border border-sky-200">
                        <div className="font-extrabold text-orange-700">2. TP Keterampilan & Kreasi (Bloom C6 - Mengkreasi):</div>
                        <p className="mt-1">
                          "Melalui fitur Canvas Tulis & Tempel Digital pada PID <strong>(C & E)</strong>, peserta didik Kelas V <strong>(A)</strong> dapat mengkreasi (C6) 3–4 kalimat deskripsi sederhana tentang keunikan diri atau teman menggunakan kata sifat, sinonim, dan antonim <strong>(B)</strong> secara runtut, santun, dan sesuai ejaan yang benar <strong>(D)</strong>."
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* B. Alur Tujuan Pembelajaran (ATP) */}
                  <div className="bg-amber-50 p-5 rounded-2xl border-2 border-amber-200 space-y-3">
                    <h4 className="text-base font-extrabold text-amber-900">
                      B. ALUR TUJUAN PEMBELAJARAN (ATP) — 1 PERTEMUAN (2 × 35 MENIT = 70 MENIT)
                    </h4>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div className="p-3.5 bg-white rounded-xl border border-amber-300">
                        <div className="font-extrabold text-sky-700">TAHAP 1: MEMAHAMI (15 Menit)</div>
                        <div className="text-[11px] font-bold text-slate-500 mb-1">Berkesadaran & Bermakna • SOLO: Unistruktural & Multistruktural</div>
                        <ul className="list-disc pl-4 space-y-1">
                          <li>Apersepsi & Kuis Tebak Kata Sifat di PID (5 Menit)</li>
                          <li>Membaca & Highlighting Teks "Rana dan Rani" di PID (10 Menit)</li>
                        </ul>
                      </div>
                      <div className="p-3.5 bg-white rounded-xl border border-amber-300">
                        <div className="font-extrabold text-orange-600">TAHAP 2: MENGAPLIKASI (40 Menit)</div>
                        <div className="text-[11px] font-bold text-slate-500 mb-1">Bermakna & Kreatif • SOLO: Relational</div>
                        <ul className="list-disc pl-4 space-y-1">
                          <li>Simulasi Pasangan Sinonim & Antonim di PID (15 Menit)</li>
                          <li>Merancang Kalimat Deskripsi Diri/Teman di Canvas Digital PID (15 Menit)</li>
                          <li>Peer-Review Interaktif di Gallery Board PID (10 Menit)</li>
                        </ul>
                      </div>
                      <div className="p-3.5 bg-white rounded-xl border border-amber-300">
                        <div className="font-extrabold text-emerald-700">TAHAP 3: MEREFLEKSI (15 Menit)</div>
                        <div className="text-[11px] font-bold text-slate-500 mb-1">Joyful & Berkesadaran • SOLO: Extended Abstract</div>
                        <ul className="list-disc pl-4 space-y-1">
                          <li>Unjuk Kerja Presentasi Kalimat Deskripsi Terpilih di PID (8 Menit)</li>
                          <li>Live Polling Refleksi Emoticon & Metakognisi di Layar PID (7 Menit)</li>
                        </ul>
                      </div>
                    </div>
                  </div>

                  {/* C. Identifikasi, Dimensi Profil Lulusan & Panduan 5 Fitur PID */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                      <h5 className="font-extrabold text-slate-900">I. Identifikasi & Dimensi Profil Lulusan</h5>
                      <p><strong>Diferensiasi Kesiapan:</strong> Mahir (mandiri & variasi diksi), Cukup (bantuan visual), Perlu Bimbingan (scaffolding kartu bergambar & kerangka kalimat).</p>
                      <p><strong>Dimensi Profil Lulusan:</strong> (1) Keimanan & Ketakwaan terhadap Tuhan YME, (2) Penalaran Kritis, (3) Kreativitas, (4) Kolaborasi & Komunikasi.</p>
                      <p><strong>Praktik Pedagogis:</strong> Discovery Learning berorientasi Deep Learning (Mindful, Meaningful, Joyful).</p>
                    </div>

                    <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 space-y-2">
                      <h5 className="font-extrabold text-emerald-950">V. Panduan 5 Fitur Utama Aplikasi "Papan Kata Unik" (PID)</h5>
                      <ul className="list-disc pl-4 space-y-1 text-emerald-900">
                        <li><strong>Fitur 1:</strong> Interactive Text Reader & Highlighting Tool ("Rana dan Rani").</li>
                        <li><strong>Fitur 2:</strong> Tap-to-Match Card Matching (Sinonim & Antonim ramah sentuh).</li>
                        <li><strong>Fitur 3:</strong> Dynamic Description Canvas + Kotak Bantuan Diksi Positif.</li>
                        <li><strong>Fitur 4:</strong> Digital Gallery Board & Lembar Peer-Review Checklist.</li>
                        <li><strong>Fitur 5:</strong> Live Reflection Polling Emoticon & Grafik Metakognisi Kelas.</li>
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="p-4 bg-slate-100 border-t border-slate-200 flex justify-end gap-3">
                  <button
                    onClick={() => {
                      setShowRppModal(false);
                      handlePrintReport();
                    }}
                    className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm flex items-center gap-2"
                  >
                    <i className="fa-solid fa-print"></i>
                    <span>Buka & Cetak Laporan Pembelajaran</span>
                  </button>
                  <button
                    onClick={() => setShowRppModal(false)}
                    className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs sm:text-sm"
                  >
                    Tutup Panduan
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
