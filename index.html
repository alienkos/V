<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuis STS Seni Kelas 5 - SDN 4 Rambutan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff; /* Light blue background */
            -webkit-tap-highlight-color: transparent;
        }

        .font-black {
            font-weight: 900;
        }

        /* Background Gradient Juicy */
        .bg-juicy {
            background: linear-gradient(135deg, #a7f3d0 0%, #38bdf8 100%);
            min-height: 100vh;
        }

        /* 3D Button Style */
        .btn-3d {
            position: relative;
            border-radius: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.1s ease-in-out;
            cursor: pointer;
            border: 2px solid transparent;
            user-select: none;
        }

        .btn-3d:active {
            transform: translateY(6px);
        }

        /* Color Variants for Options */
        .btn-color-0 { background-color: #f43f5e; border-color: #be123c; color: white; box-shadow: 0 6px 0 0 #9f1239; margin-bottom: 8px; }
        .btn-color-0:active { box-shadow: 0 0px 0 0 #9f1239; }

        .btn-color-1 { background-color: #3b82f6; border-color: #1d4ed8; color: white; box-shadow: 0 6px 0 0 #1e40af; margin-bottom: 8px; }
        .btn-color-1:active { box-shadow: 0 0px 0 0 #1e40af; }

        .btn-color-2 { background-color: #10b981; border-color: #047857; color: white; box-shadow: 0 6px 0 0 #065f46; margin-bottom: 8px; }
        .btn-color-2:active { box-shadow: 0 0px 0 0 #065f46; }

        .btn-color-3 { background-color: #f59e0b; border-color: #b45309; color: white; box-shadow: 0 6px 0 0 #92400e; margin-bottom: 8px; }
        .btn-color-3:active { box-shadow: 0 0px 0 0 #92400e; }

        /* Specific Buttons */
        .btn-start { background-color: #8b5cf6; border-color: #6d28d9; color: white; box-shadow: 0 8px 0 0 #5b21b6; margin-bottom: 8px; }
        .btn-start:active { transform: translateY(8px); box-shadow: 0 0px 0 0 #5b21b6; margin-bottom: 8px; }

        .btn-next { background-color: #0ea5e9; border-color: #0369a1; color: white; box-shadow: 0 6px 0 0 #075985; margin-bottom: 8px; }
        .btn-next:active { box-shadow: 0 0px 0 0 #075985; }

        /* Animations */
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Glass Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Trading Card Styling */
        .trading-card {
            background: linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 100%);
            border: 8px solid #fbbf24;
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .card-inner-border {
            border: 4px dashed #818cf8;
            border-radius: 1rem;
            margin: 8px;
            padding: 1.5rem;
            height: calc(100% - 16px);
            background: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="bg-juicy flex items-center justify-center p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-md mx-auto">

        <!-- ================= START SCREEN ================= -->
        <div id="start-screen" class="glass-panel rounded-3xl p-8 text-center animate-pop-in">
            <div class="text-6xl mb-4">🎨🎵</div>
            <h1 class="text-3xl font-black text-purple-700 mb-2 leading-tight">
                Kuis STS Seni
            </h1>
            <h2 class="text-xl font-bold text-gray-600 mb-2">Kelas 5</h2>
            <p class="text-sm font-bold text-gray-400 mb-8">SDN 4 Rambutan</p>
            
            <div class="mb-6 text-left">
                <label class="block text-gray-700 font-bold mb-2 ml-2">Siapa namamu?</label>
                <input 
                    type="text" 
                    id="player-name" 
                    class="w-full text-2xl font-bold text-center border-4 border-purple-200 rounded-2xl p-4 focus:outline-none focus:border-purple-500 bg-white"
                    placeholder="Ketik namamu..."
                    maxlength="15"
                >
            </div>

            <button onclick="startQuiz()" class="btn-3d btn-start w-full text-xl py-4 flex items-center justify-center gap-2">
                Mulai Bermain <i class="fa-solid fa-play"></i>
            </button>
        </div>


        <!-- ================= QUIZ SCREEN ================= -->
        <div id="quiz-screen" class="hidden flex flex-col gap-4 animate-pop-in">
            <!-- Header -->
            <div class="flex justify-between items-center bg-white rounded-2xl p-4 shadow-sm border-2 border-blue-200">
                <div class="font-bold text-blue-700 bg-blue-100 px-3 py-1 rounded-lg">
                    <i class="fa-solid fa-list-check mr-2"></i>
                    Soal <span id="current-q-num">1</span>/20
                </div>
                <div class="font-black text-xl text-orange-500 flex items-center bg-orange-100 px-3 py-1 rounded-lg">
                    <i class="fa-solid fa-star text-yellow-400 mr-2"></i>
                    <span id="score-display">0</span>
                </div>
            </div>

            <!-- Question Card -->
            <div class="glass-panel rounded-3xl p-6 text-center shadow-lg relative overflow-hidden mt-2">
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <i class="fa-solid fa-palette text-6xl"></i>
                </div>
                <h3 id="question-text" class="text-xl font-bold text-gray-800 leading-snug mb-2 relative z-10">
                    <!-- Question goes here -->
                </h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="flex flex-col mt-4">
                <!-- Buttons injected via JS -->
            </div>
        </div>


        <!-- ================= FEEDBACK MODAL ================= -->
        <div id="feedback-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div id="modal-content" class="bg-white rounded-3xl p-6 max-w-sm w-full text-center border-8 shadow-2xl relative overflow-hidden">
                
                <div id="modal-icon" class="text-7xl mb-4 mt-2"></div>
                <h2 id="modal-title" class="text-3xl font-black mb-2"></h2>
                
                <div class="bg-gray-100 rounded-xl p-4 mb-6 mt-4 text-left border-2 border-gray-200">
                    <p class="text-sm font-bold text-gray-500 mb-1">
                        <i class="fa-solid fa-lightbulb text-yellow-500 mr-1"></i> Penjelasan:
                    </p>
                    <p id="modal-explanation" class="text-gray-800 font-bold leading-tight"></p>
                </div>

                <button onclick="nextQuestion()" class="btn-3d btn-next w-full text-xl py-3 flex justify-center items-center gap-2">
                    Lanjut <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>


        <!-- ================= RESULT SCREEN ================= -->
        <div id="result-screen" class="hidden flex flex-col items-center animate-pop-in w-full">
            
            <div class="text-center mb-6 bg-white/80 p-4 rounded-2xl backdrop-blur-sm border-2 border-white w-full shadow-lg">
                <h2 class="text-3xl font-black text-purple-700">Kuis Selesai!</h2>
                <p class="font-bold text-gray-700">Kerja yang luar biasa!</p>
            </div>

            <!-- TRADING CARD (To be downloaded) -->
            <div id="trading-card" class="trading-card w-full max-w-[320px] shadow-2xl mb-8">
                <div class="card-inner-border flex flex-col items-center text-center relative z-10">
                    
                    <div class="w-full flex justify-between items-center mb-4">
                        <i class="fa-solid fa-award text-3xl text-yellow-500"></i>
                        <div class="text-xs font-black text-indigo-500 tracking-wider uppercase text-right">
                            Kuis STS Seni<br>Kelas 5
                        </div>
                    </div>
                    
                    <!-- Avatar placeholder -->
                    <div class="w-24 h-24 bg-gradient-to-tr from-purple-400 to-blue-400 rounded-full flex items-center justify-center border-4 border-white shadow-md mb-4">
                        <i class="fa-solid fa-user-graduate text-4xl text-white"></i>
                    </div>
                    
                    <h3 id="card-name" class="text-2xl font-black text-gray-800 leading-tight w-full break-words px-2">
                        Nama Pemain
                    </h3>
                    
                    <div class="mt-2 text-sm font-bold text-gray-500">SDN 4 Rambutan</div>

                    <div class="mt-6 bg-indigo-50 w-full rounded-2xl p-4 border-2 border-indigo-100 shadow-inner">
                        <p class="text-indigo-400 font-bold text-sm mb-1">SKOR AKHIR</p>
                        <div class="text-6xl font-black text-indigo-600 flex items-center justify-center">
                            <span id="card-score">100</span>
                        </div>
                    </div>
                    
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex w-full gap-4">
                <button onclick="downloadCard()" class="flex-1 btn-3d btn-color-2 text-sm py-4 flex flex-col items-center justify-center gap-1">
                    <i class="fa-solid fa-download text-xl"></i>
                    <span>Unduh Kartu</span>
                </button>
                
                <button onclick="restartQuiz()" class="flex-1 btn-3d btn-color-3 text-sm py-4 flex flex-col items-center justify-center gap-1">
                    <i class="fa-solid fa-rotate-right text-xl"></i>
                    <span>Main Lagi</span>
                </button>
            </div>
            
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const quizData = [
            { "q": "Unsur seni rupa yang berupa goresan atau tarikan yang terbentuk dari kumpulan titik-titik saling terhubung disebut...", "opts": ["Bidang", "Garis", "Tekstur", "Ruang"], "ans": "Garis", "expC": "Hebat! Garis adalah kumpulan titik yang terhubung.", "expW": "Jawaban yang tepat adalah Garis. Bidang adalah area, tekstur itu permukaan, ruang itu volume." },
            { "q": "Hasil pencampuran dua warna primer antara warna kuning dan warna biru akan menghasilkan warna sekunder, yaitu...", "opts": ["Hijau", "Jingga", "Ungu", "Cokelat"], "ans": "Hijau", "expC": "Keren! Kuning dan biru menghasilkan hijau.", "expW": "Jawaban yang tepat adalah Hijau. Jingga itu merah+kuning, ungu itu merah+biru." },
            { "q": "Prinsip seni rupa berupa pengulangan unsur-unsur visual secara teratur dan berkesinambungan sehingga menciptakan kesan gerak dinamakan...", "opts": ["Proporsi", "Ritme/Irama", "Keseimbangan", "Tekstur"], "ans": "Ritme/Irama", "expC": "Pintar! Ritme adalah pengulangan yang memberi kesan gerak.", "expW": "Jawaban yang tepat adalah Ritme/Irama. Proporsi itu perbandingan ukuran." },
            { "q": "Saat menggambar teko dan cangkir, ukuran teko digambar lebih besar dibanding cangkir agar terlihat wajar dan serasi. Hal ini menerapkan prinsip...", "opts": ["Komposisi", "Ritme", "Proporsi", "Gelap-terang"], "ans": "Proporsi", "expC": "Betul sekali! Proporsi mengatur perbandingan ukuran benda agar serasi.", "expW": "Jawaban yang tepat adalah Proporsi." },
            { "q": "Tata letak gambar di mana bagian sebelah kiri dan kanan memiliki bentuk, ukuran, dan beban visual yang sama dinamakan keseimbangan...", "opts": ["Asimetris", "Ritme", "Proporsi", "Simetris"], "ans": "Simetris", "expC": "Tepat! Kiri dan kanan sama persis disebut simetris.", "expW": "Jawaban yang tepat adalah Simetris. Asimetris itu jika kiri dan kanan berbeda." },
            { "q": "Alat musik yang berfungsi untuk menjaga tempo atau mengatur irama lagu dan tidak memiliki nada tergolong alat musik...", "opts": ["Melodis", "Ritmis", "Harmonis", "Diatonis"], "ans": "Ritmis", "expC": "Hebat! Alat musik tanpa nada disebut ritmis.", "expW": "Jawaban yang tepat adalah Ritmis. Melodis itu bernada." },
            { "q": "Contoh alat musik melodis sederhana yang dimainkan dengan cara ditiup sambil menekan tuts adalah...", "opts": ["Tamborin", "Pianika", "Kendang", "Marakas"], "ans": "Pianika", "expC": "Luar biasa! Pianika ditiup dan ditekan tutsnya.", "expW": "Jawaban yang tepat adalah Pianika." },
            { "q": "Tanda birama 4/4 pada sebuah karya lagu menandakan bahwa dalam setiap birama terdapat...", "opts": ["2 ketukan", "3 ketukan", "4 ketukan", "5 ketukan"], "ans": "4 ketukan", "expC": "Pintar! Angka atas pada 4/4 menunjukkan jumlah ketukan.", "expW": "Jawaban yang tepat adalah 4 ketukan." },
            { "q": "Susunan urutan notasi angka tangga nada diatonis mayor yang benar dari nada terendah ke tertinggi adalah...", "opts": ["1-2-3-4-5-6-7-1'", "1-3-5-2-4-6-7-1'", "7-6-5-4-3-2-1-0", "1-1-2-2-3-3-4-4"], "ans": "1-2-3-4-5-6-7-1'", "expC": "Tepat! Tangga nada mayor berurutan dari do rendah ke do tinggi.", "expW": "Jawaban yang tepat adalah 1-2-3-4-5-6-7-1'." },
            { "q": "Rangkaian daftar lagu atau karya musik yang disiapkan untuk dibawakan dalam pertunjukan musik dinamakan...", "opts": ["Aransemen", "Repertoar", "Partitur", "Tangga nada"], "ans": "Repertoar", "expC": "Betul! Repertoar adalah daftar lagu yang disiapkan.", "expW": "Jawaban yang tepat adalah Repertoar. Aransemen itu gubahan lagu." },
            { "q": "Nilai permukaan suatu benda yang dapat dirasakan halus atau kasarnya disebut...", "opts": ["Komposisi", "Tekstur", "Kendang", "Ansambel"], "ans": "Tekstur", "expC": "Bagus! Halus atau kasarnya permukaan disebut tekstur.", "expW": "Jawaban yang tepat adalah Tekstur." },
            { "q": "Alat musik ritmis tradisional yang terbuat dari kayu dan dilapisi selaput kulit hewan adalah...", "opts": ["Angklung", "Kendang", "Pianika", "Tamborin"], "ans": "Kendang", "expC": "Tepat! Kendang dari kayu dan kulit hewan.", "expW": "Jawaban yang tepat adalah Kendang." },
            { "q": "Pengaturan tata letak dan penempatan objek gambar pada bidang kertas agar seimbang disebut...", "opts": ["Komposisi", "Tekstur", "Ritme", "Proporsi"], "ans": "Komposisi", "expC": "Hebat! Komposisi mengatur letak agar seimbang dan indah.", "expW": "Jawaban yang tepat adalah Komposisi." },
            { "q": "Alat musik melodis khas yang terbuat dari bilah bambu dan dimainkan dengan digoyangkan adalah...", "opts": ["Kendang", "Angklung", "Marakas", "Tamborin"], "ans": "Angklung", "expC": "Keren! Angklung dari bambu dan digoyangkan.", "expW": "Jawaban yang tepat adalah Angklung." },
            { "q": "Kegiatan bermain musik secara bersama-sama menggunakan berbagai macam alat musik disebut...", "opts": ["Ansambel", "Aransemen", "Repertoar", "Partitur"], "ans": "Ansambel", "expC": "Pintar! Bermain musik bersama disebut ansambel.", "expW": "Jawaban yang tepat adalah Ansambel." },
            { "q": "BENAR atau SALAH: Alat musik ritmis berfungsi sebagai pembawa melodi utama lagu.", "opts": ["Benar", "Salah"], "ans": "Salah", "expC": "Betul! Alat musik ritmis mengatur tempo, bukan melodi.", "expW": "Pernyataan ini Salah. Alat musik ritmis itu tidak bernada, fungsinya mengatur irama." },
            { "q": "BENAR atau SALAH: Warna merah, kuning, dan biru tergolong sebagai kelompok warna primer.", "opts": ["Benar", "Salah"], "ans": "Benar", "expC": "Tepat! Merah, kuning, biru adalah warna dasar/primer.", "expW": "Pernyataan ini Benar. Merah, kuning, biru tidak bisa dibuat dari campuran warna lain." },
            { "q": "BENAR atau SALAH: Birama 3/4 menunjukkan bahwa setiap birama terdiri atas 3 ketukan.", "opts": ["Benar", "Salah"], "ans": "Benar", "expC": "Hebat! Angka 3 menunjukkan ada 3 ketukan tiap birama.", "expW": "Pernyataan ini Benar." },
            { "q": "BENAR atau SALAH: Pengulangan bentuk garis atau bidang secara berturut-turut pada pola keramik lantai membentuk prinsip ritme.", "opts": ["Benar", "Salah"], "ans": "Benar", "expC": "Betul! Pengulangan pola secara teratur membentuk ritme.", "expW": "Pernyataan ini Benar." },
            { "q": "BENAR atau SALAH: Pianika dan rekorder merupakan contoh alat musik ritmis yang tidak bernada.", "opts": ["Benar", "Salah"], "ans": "Salah", "expC": "Tepat! Pianika dan rekorder memiliki nada, jadi termasuk melodis.", "expW": "Pernyataan ini Salah. Mereka memiliki nada, jadi termasuk alat musik melodis." }
        ];

        // State Variables
        let playerName = '';
        let currentQuestionIndex = 0;
        let correctAnswers = 0;

        // DOM Elements
        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };
        const nameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNumDisplay = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');
        
        // Modal Elements
        const modal = document.getElementById('feedback-modal');
        const modalContent = document.getElementById('modal-content');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalExp = document.getElementById('modal-explanation');

        // Functions
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
            screens[screenName].classList.remove('animate-pop-in');
            // Trigger reflow to restart animation
            void screens[screenName].offsetWidth; 
            screens[screenName].classList.add('animate-pop-in');
        }

        function startQuiz() {
            playerName = nameInput.value.trim();
            if (!playerName) {
                // Shake effect if empty
                nameInput.classList.add('animate-pulse', 'border-red-500');
                setTimeout(() => nameInput.classList.remove('animate-pulse', 'border-red-500'), 500);
                return;
            }
            
            currentQuestionIndex = 0;
            correctAnswers = 0;
            scoreDisplay.textContent = '0';
            
            switchScreen('quiz');
            loadQuestion();
        }

        function loadQuestion() {
            const currentQ = quizData[currentQuestionIndex];
            currentQNumDisplay.textContent = currentQuestionIndex + 1;
            questionText.textContent = currentQ.q;
            
            optionsContainer.innerHTML = '';
            
            currentQ.opts.forEach((opt, index) => {
                const btn = document.createElement('button');
                // Loop color class based on index (0 to 3)
                const colorClass = `btn-color-${index % 4}`;
                btn.className = `btn-3d ${colorClass} w-full py-4 text-lg rounded-xl text-left px-6 flex items-center justify-between`;
                
                btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-chevron-right opacity-50 text-sm"></i>`;
                btn.onclick = () => handleAnswer(opt, currentQ);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedOption, questionData) {
            const isCorrect = selectedOption === questionData.ans;
            
            if (isCorrect) {
                correctAnswers++;
                scoreDisplay.textContent = (correctAnswers * 5); // 5 points per question = max 100
                
                // Set Modal for Correct
                modalContent.style.borderColor = '#10b981'; // emerald-500
                modalIcon.innerHTML = '<i class="fa-solid fa-face-smile-beam text-emerald-500"></i>';
                modalTitle.textContent = 'Hore! Tepat!';
                modalTitle.className = 'text-3xl font-black mb-2 text-emerald-600';
                modalExp.textContent = questionData.expC;
            } else {
                // Set Modal for Wrong
                modalContent.style.borderColor = '#f43f5e'; // rose-500
                modalIcon.innerHTML = '<i class="fa-solid fa-face-sad-tear text-rose-500"></i>';
                modalTitle.textContent = 'Ups, Kurang Tepat!';
                modalTitle.className = 'text-3xl font-black mb-2 text-rose-600';
                modalExp.textContent = questionData.expW;
            }
            
            // Show modal
            modalContent.classList.remove('animate-pop-in');
            void modalContent.offsetWidth; 
            modalContent.classList.add('animate-pop-in');
            modal.classList.remove('hidden');
        }

        function nextQuestion() {
            modal.classList.add('hidden');
            currentQuestionIndex++;
            
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('card-name').textContent = playerName;
            document.getElementById('card-score').textContent = (correctAnswers * 5);
            switchScreen('result');
        }

        function restartQuiz() {
            nameInput.value = '';
            switchScreen('start');
        }

        // HTML2Canvas export function
        function downloadCard() {
            const card = document.getElementById('trading-card');
            
            // Store original styling to restore later if needed
            const originalTransform = card.style.transform;
            card.style.transform = "none"; 

            html2canvas(card, {
                scale: 2, // High resolution
                backgroundColor: null, // Transparent background around card
                logging: false,
                useCORS: true
            }).then(canvas => {
                // Restore original style
                card.style.transform = originalTransform;

                // Create download link
                const link = document.createElement('a');
                const safeName = playerName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                link.download = `Kartu-Kuis-Seni-${safeName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Gagal membuat kartu:", err);
                alert("Maaf, terjadi kesalahan saat mengunduh kartu.");
            });
        }
    </script>
</body>
</html>
